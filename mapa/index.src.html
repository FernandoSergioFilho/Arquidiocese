<title>Mapa das Paróquias da Ilha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=Inter:wght@400;500;600&display=swap">
<style>
/*@@LEAFLET_CSS@@*/
/* Layout: o mapa ocupa a tela inteira; barra, painel e controles flutuam sobre ele.
   Desktop: painel-cartão à esquerda. Celular: folha que sobe de baixo (recolhida / meia / cheia). */
:root{
  --water:#cfe1ec; --land:#eef1f2; --land-line:#c6ced3;
  --bg:#eef2f5; --panel:#ffffff; --panel-2:#f4f7f9;
  --ink:#10253b; --fg:#13202c; --muted:#5b6b78; --rule:#dde4ea;
  --accent:#1f5fae; --accent-ink:#ffffff; --gold:#b38a2e;
  --ok:#2c7a4b; --warn:#a4660f; --chip:#eef3f7; --label-halo:#ffffff;
  --shadow:0 1px 2px rgb(16 37 59/.08),0 8px 28px rgb(16 37 59/.14);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --water:#0c1824; --land:#1a2531; --land-line:#2d3b48;
  --bg:#0a121b; --panel:#121d29; --panel-2:#172431;
  --ink:#e8eef4; --fg:#e6edf3; --muted:#93a3b2; --rule:#24323f;
  --accent:#7fb3ee; --accent-ink:#0b1724; --gold:#d9b25a;
  --ok:#6cc495; --warn:#e5a957; --chip:#1b2937; --label-halo:#0c1824;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --water:#0c1824; --land:#1a2531; --land-line:#2d3b48;
  --bg:#0a121b; --panel:#121d29; --panel-2:#172431;
  --ink:#e8eef4; --fg:#e6edf3; --muted:#93a3b2; --rule:#24323f;
  --accent:#7fb3ee; --accent-ink:#0b1724; --gold:#d9b25a;
  --ok:#6cc495; --warn:#e5a957; --chip:#1b2937; --label-halo:#0c1824;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--water);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden}
.app{position:relative;height:100%}
#map{position:absolute;inset:0;background:var(--water)}
.leaflet-container{background:var(--water);font-family:var(--body)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Barra superior flutuante */
.topbar{position:absolute;z-index:900;top:12px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;gap:10px;align-items:center;pointer-events:none}
.topbar > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--panel);border-radius:var(--r);padding:8px 14px 8px 10px;box-shadow:var(--shadow);min-width:0}
.brand svg{flex:none}
.brand .t{display:flex;flex-direction:column;min-width:0}
.brand small{font:600 10px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{margin:0;font:800 21px/1.05 var(--display);font-stretch:72%;letter-spacing:.005em;white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow)}
.seg button{font:600 13px var(--body);padding:7px 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.search{position:relative}
.search input{font:14px var(--body);padding:10px 12px 10px 34px;width:250px;border:0;border-radius:12px;background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.search::before{content:"";position:absolute;left:12px;top:50%;width:13px;height:13px;margin-top:-8px;border:2px solid var(--muted);border-radius:50%}
.search::after{content:"";position:absolute;left:24px;top:50%;width:6px;height:2px;margin-top:4px;background:var(--muted);transform:rotate(45deg)}
.search ul{position:absolute;z-index:1000;top:calc(100% + 6px);left:0;right:0;min-width:280px;margin:0;padding:6px;list-style:none;background:var(--panel);border-radius:12px;max-height:320px;overflow:auto;box-shadow:var(--shadow)}
.search li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;cursor:pointer}
.search li button:hover,.search li button:focus-visible{background:var(--chip)}
.search li small{color:var(--muted)}

/* Voltar ao mapa geral */
#voltar{position:absolute;z-index:850;display:inline-flex;align-items:center;gap:8px;font:600 14px var(--body);padding:10px 16px 10px 12px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);cursor:pointer;
  top:72px;left:calc(max(12px,env(safe-area-inset-left,0px)) + 392px)}
#voltar svg{flex:none}
#voltar[hidden]{display:none}

/* Painel */
aside{position:absolute;z-index:800;top:72px;bottom:12px;left:max(12px,env(safe-area-inset-left,0px));width:372px;display:flex;flex-direction:column;
  background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.handle{display:none}
.body{overflow:auto;padding:18px 18px 22px;min-height:0;flex:1}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--muted)}
.crumbs button{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{opacity:.5}
.eyebrow{display:flex;align-items:center;gap:6px;margin-top:12px;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
aside h2{font:800 32px/1 var(--display);font-stretch:72%;margin:6px 0 8px;text-wrap:balance;color:var(--ink)}
aside h3{display:flex;align-items:center;gap:8px;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:22px 0 8px}
aside h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;flex:none}
.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.list button,.list a.ext{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--fg)}
.list button:hover,.list button:focus-visible,.list a.ext:hover{background:var(--chip)}
.list .meta{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.list .name{min-width:0;line-height:1.3}
.list small{font-size:12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0;padding:12px 14px;border-radius:12px;background:var(--panel-2);font-size:13px}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0}
.note{font-size:13px;line-height:1.5;color:var(--muted);margin:10px 0 0}
.note a{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--panel-2)}
.stats b{font:800 28px/1 var(--display);font-stretch:72%;font-variant-numeric:tabular-nums;color:var(--ink)}
.stats small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.legend-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend-key span{display:inline-flex;gap:6px;align-items:center}
.k-solid{width:16px;height:10px;border-radius:3px;background:var(--muted)}
.k-est{width:16px;height:10px;border-radius:3px;border:1.5px dashed var(--muted);box-sizing:border-box;background:color-mix(in srgb,var(--muted) 25%,transparent)}
.k-pin svg{width:13px;height:15px}

/* Mapa: rótulos, igrejas, janelas */
.leaflet-control-zoom{border:0!important;box-shadow:var(--shadow)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--fg)!important;border-color:var(--rule)!important;width:36px!important;height:36px!important;line-height:36px!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--muted)!important;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:var(--accent)!important}
.lbl{background:transparent;border:0;box-shadow:none;padding:0;font:600 10.5px var(--body);color:var(--fg);
  text-shadow:0 0 3px var(--label-halo),0 0 3px var(--label-halo),0 0 2px var(--label-halo);white-space:nowrap}
.lbl::before{display:none}
.lbl.big{font:700 13px var(--display);font-stretch:80%;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.85}
.hide-lbl .lbl:not(.big){display:none}
.com-pinos .lbl:not(.big){display:none}
.tip{font:13px var(--body);border-radius:10px;border:0;background:var(--panel);color:var(--fg);box-shadow:var(--shadow);padding:8px 11px}
.tip b{display:block;font-size:14px}
.tip::before{display:none}
.pin{display:flex;align-items:flex-end;gap:3px;white-space:nowrap;font:600 11px var(--body);color:var(--fg);cursor:pointer;transition:opacity .2s}
.pin svg{flex:none;filter:drop-shadow(0 1px 1.5px rgb(0 0 0/.4))}
.pin span{padding-bottom:2px;text-shadow:0 0 3px var(--label-halo),0 0 3px var(--label-halo),0 0 2px var(--label-halo)}
.hide-pinlbl .pin span{display:none}
.hide-pinlbl .destaque .pin span{display:inline}
.apagado .pin{opacity:.2}
.apagado .pin span{display:none}
.sel .pin svg{transform:scale(1.4);transform-origin:bottom center}
.ico{display:inline-flex;flex:none}
.ico svg{width:16px;height:19px}
.janela .leaflet-popup-content-wrapper{background:var(--panel);color:var(--fg);border-radius:var(--r);box-shadow:var(--shadow)}
.janela .leaflet-popup-tip{background:var(--panel)}
.janela .leaflet-popup-content{margin:16px 18px;font:13px/1.45 var(--body)}
.janela a.leaflet-popup-close-button{color:var(--muted);font-size:22px;padding:8px 10px 0 0;width:auto;height:auto}
.j-eyebrow{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.j-eyebrow svg{width:16px;height:19px}
.j-title{font:800 24px/1.02 var(--display);font-stretch:72%;margin:5px 0 5px;padding-right:14px;color:var(--ink)}
.j-sub{color:var(--muted)}
.j-sub .sw{width:9px;height:9px;margin-right:5px;vertical-align:0}
.j-ok{margin-top:8px;font-size:12px;color:var(--ok)}
.j-note{margin-top:8px;font-size:12px;color:var(--warn)}
.j-acts{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.opt{font:600 13px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);cursor:pointer;text-align:left}
.opt.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:hover{border-color:var(--accent)}

/* Celular */
@media (max-width:760px){
  .topbar{flex-wrap:wrap;gap:8px;top:max(8px,env(safe-area-inset-top,0px))}
  .brand{flex:1 1 auto;padding:7px 12px 7px 9px}
  .brand h1{font-size:19px}
  .tools{width:100%;margin-left:0}
  .search{flex:1;min-width:0}
  .search input{width:100%;box-sizing:border-box}
  .search ul{min-width:0}
  #voltar{top:auto;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h,64px) + 12px)}
  aside{top:auto;left:0;right:0;bottom:0;width:auto;border-radius:18px 18px 0 0;max-height:min(var(--sheet-max,52vh),calc(100% - 140px));transition:max-height .25s}
  aside.full{--sheet-max:calc(100% - 120px)}
  aside.collapsed .body{display:none}
  .handle{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;cursor:pointer;
    padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule)}
  aside.collapsed .handle{border-bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .handle::before{content:"";align-self:center;width:40px;height:4px;border-radius:2px;background:var(--rule)}
  .handle .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .handle b{font:800 18px/1.1 var(--display);font-stretch:75%;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .handle span{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
  .body{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  aside h2{font-size:27px}
  .leaflet-bottom.leaflet-right{bottom:calc(var(--sheet-h,64px) + 4px)}
  .leaflet-control-zoom{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div id="map" aria-label="Mapa dos bairros da Ilha coloridos por paróquia"></div>
  <div class="topbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="M15 6v18M9 12h12" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/></svg>
      <div class="t"><small>Arquidiocese de Florianópolis</small><h1>Paróquias da Ilha</h1></div>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Colorir mapa por">
        <button id="modo-paroquia" type="button" aria-pressed="true">Paróquias</button>
        <button id="modo-forania" type="button" aria-pressed="false">Foranias</button>
      </div>
      <div class="search">
        <input id="busca" type="search" placeholder="Buscar igreja, bairro ou paróquia" autocomplete="off" aria-label="Buscar igreja, bairro ou paróquia">
        <ul id="sugestoes" hidden></ul>
      </div>
    </div>
  </div>
  <button id="voltar" type="button" hidden><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Voltar ao mapa geral</button>
  <aside id="painel">
    <button class="handle" id="alca" type="button" aria-expanded="true"><span class="row"><b id="alca-titulo">Ilha de Santa Catarina</b><span id="alca-ico">Recolher</span></span></button>
    <div class="body" id="conteudo"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(async function(){
const CORES = {
  desterro:'#a3303f', 'santo-antonio':'#8a6a3b', 'santa-teresinha':'#e58fa8', lourdes:'#e07b39', 'boa-viagem':'#c9a227',
  lapa:'#b04aa0', 'sagrado-coracao':'#7e57c2', lagoa:'#1f8a9e', necessidades:'#3b7a3e', guadalupe:'#2e6fd1',
  ingleses:'#49b0e0', trindade:'#4f5d7e', 'sao-francisco-xavier':'#7bb047'
};
const CORES_FORANIA = {'centro-sul':'#c2563a', 'norte':'#2f6fb0'};
const fmt = n => n.toLocaleString('pt-BR');
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let D;
try { D = await (await fetch('dados.json')).json(); }
catch(e){ document.getElementById('conteudo').innerHTML = '<p class="note">Não foi possível carregar os dados do mapa. Recarregue a página.</p>'; return; }

const H = D.hierarquia;
const forania = {}, paroquia = {};
H.foranias.forEach(f => { forania[f.id] = f; f.paroquias.forEach(p => { p.forania = f.id; paroquia[p.id] = p; p.bairros = []; p.pop = 0; }); });
const bairros = D.bairros.features;
bairros.forEach(b => {
  const pr = b.properties;
  pr.grupo = pr.principal;
  pr.paroquias.forEach(id => paroquia[id].bairros.push(b));
});
const nomeGrupo = pr => paroquia[pr.principal].nome + (pr.paroquias.length > 1 ? ` <span style="color:var(--muted)">+${pr.paroquias.length-1}</span>` : '');
const comunidadesEm = nome => Object.values(paroquia).flatMap(p => p.comunidades.filter(c => c.bairro === nome).map(c => ({...c, paroquia:p})));
const corGrupo = id => CORES[id] || '#888';

let modo = 'paroquia', sel = null; // sel: {tipo:'bairro'|'paroquia'|'forania'|'arq', id}

const map = L.map('map', {zoomControl:false, attributionControl:true, zoomSnap:.25, minZoom:10, maxZoom:17});
L.control.zoom({position:'bottomright'}).addTo(map);
const celular = () => matchMedia('(max-width:760px)').matches;
const pad = () => celular()
  ? {paddingTopLeft:[16, 120], paddingBottomRight:[16, (document.getElementById('painel').offsetHeight||64) + 16]}
  : {paddingTopLeft:[400, 72], paddingBottomRight:[28, 28]};
map.attributionControl.setPrefix(false).addAttribution('Bairros: IBGE · Igrejas: Arquidiocese e © OpenStreetMap');
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();

const fundo = L.geoJSON(D.fundo, {interactive:false, style:()=>({color:tok('--land-line'), weight:1, fillColor:tok('--land'), fillOpacity:1})}).addTo(map);

function estilo(f){
  const pr = f.properties, est = pr.situacao === 'estimado';
  const cor = modo === 'forania' ? CORES_FORANIA[pr.forania] : corGrupo(pr.grupo);
  let ativo = true;
  if (sel && sel.tipo === 'paroquia') ativo = pr.paroquias.includes(sel.id);
  if (sel && sel.tipo === 'igreja') ativo = pr.paroquias.includes(igreja[sel.id].paroquia.id);
  if (sel && sel.tipo === 'forania') ativo = pr.forania === sel.id;
  if (sel && sel.tipo === 'paroquia' && ativo && pr.principal !== sel.id) return {color:corGrupo(sel.id), weight:2, dashArray:'4 3', fillColor:corGrupo(sel.id), fillOpacity:.25, opacity:1};
  const escolhido = sel && sel.tipo === 'bairro' && sel.id === pr.bairro;
  return {
    color: escolhido ? tok('--fg') : tok('--panel'), weight: escolhido ? 3 : (est ? .8 : 1.2),
    dashArray: null,
    fillColor: cor, fillOpacity: ativo ? (est ? .38 : .88) : .08, opacity: ativo ? 1 : .4
  };
}

const rotulos = [];
const camada = L.geoJSON(D.bairros, {
  style: estilo,
  onEachFeature(f, l){
    const pr = f.properties;
    l.on({
      mouseover(e){ if (!(sel && sel.tipo==='bairro' && sel.id===pr.bairro)) l.setStyle({weight:2.5, color:tok('--fg')}); l.bringToFront(); },
      mouseout(){ l.setStyle(estilo(f)); },
      click(e){ abrirJanelaBairro(pr, e.latlng); }
    });
    if (matchMedia('(hover: hover)').matches) l.bindTooltip(() => `<b>${pr.bairro}</b>${nomeGrupo(pr)}<br><span style="color:var(--muted)">${pr.situacao==='estimado'?'Estimado por vizinhança':'Confirmado'}</span>`, {sticky:true, className:'tip', direction:'top', offset:[0,-8]});
    const c = l.getBounds().getCenter();
    rotulos.push(L.tooltip({permanent:true, direction:'center', className:'lbl', interactive:false}).setLatLng(c).setContent(pr.bairro));
  }
}).addTo(map);

const grupoRotulos = L.layerGroup(rotulos).addTo(map);
[['Oceano Atlântico',-27.66,-48.38],['Baía Norte',-27.49,-48.565],['Baía Sul',-27.68,-48.585],['São José',-27.625,-48.66],['Biguaçu',-27.45,-48.66],['Palhoça',-27.74,-48.66]]
  .forEach(([t,la,lo]) => L.tooltip({permanent:true,direction:'center',className:'lbl big',interactive:false}).setLatLng([la,lo]).setContent(t).addTo(map));

const limites = L.latLngBounds([-27.84,-48.6],[-27.38,-48.36]);
map.fitBounds(limites, pad());
map.setMaxBounds(camada.getBounds().pad(1.2));
const atualizaRotulos = () => document.getElementById('map').classList.toggle('hide-lbl', map.getZoom() < 12.75);
map.on('zoomend', atualizaRotulos); atualizaRotulos();

// Igrejas: todas sempre no mapa. Posição exata quando houver lat/lng; senão, aproximada dentro do bairro.
const pontoDe = nome => bairros.find(b => b.properties.bairro === nome).properties.ponto;
const igrejas = [];
Object.values(paroquia).forEach(p => p.comunidades.forEach((c, k) => { c.id = p.id + '-' + k; c.paroquia = p; igrejas.push(c); }));
const porBairroAprox = {};
igrejas.forEach(c => { if (!c.lat && c.bairro) (porBairroAprox[c.bairro] = porBairroAprox[c.bairro] || []).push(c); });
Object.entries(porBairroAprox).forEach(([b, cs]) => {
  const [la, lo] = pontoDe(b), n = cs.length;
  cs.forEach((c, k) => { const ang = 2*Math.PI*k/n, r = n > 1 ? 0.0022 + 0.0007*n : 0; c.pos = [la + r*Math.cos(ang), lo + r*Math.sin(ang)/0.885]; c.aprox = true; });
});
igrejas.forEach(c => { if (c.lat) { c.pos = [c.lat, c.lng]; c.aprox = false; } });
const igreja = Object.fromEntries(igrejas.map(c => [c.id, c]));

const ICONE = (cor, matriz) => `<svg viewBox="0 0 24 28" width="${matriz?26:20}" height="${matriz?30:23}" aria-hidden="true"><path d="M12 1v4M10 3h4" style="stroke:${cor}" stroke-width="2" stroke-linecap="round"/><path d="M12 6l7 6v14H5V12z" style="fill:${cor};stroke:var(--panel)" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 26v-5a2 2 0 0 1 4 0v5" style="fill:var(--panel)"/></svg>`;
const camadaIgrejas = L.layerGroup().addTo(map);
const marcador = {};
igrejas.filter(c => c.pos).forEach(c => {
  const m = L.marker(c.pos, {
    icon: L.divIcon({className:'', html:`<div class="pin${c.matriz?' matriz':''}">${ICONE(corGrupo(c.paroquia.id), c.matriz)}<span>${esc(c.nome)}</span></div>`, iconSize:null, iconAnchor:[c.matriz?13:10, c.matriz?28:22]}),
    keyboard:true, riseOnHover:true, title:c.nome
  });
  m.on('click', () => abrirJanelaIgreja(c));
  marcador[c.id] = m; camadaIgrejas.addLayer(m);
});
function estiloIgrejas(){
  igrejas.forEach(c => {
    const m = marcador[c.id]; if (!m) return;
    let ativo = true;
    if (sel && sel.tipo === 'paroquia') ativo = c.paroquia.id === sel.id;
    if (sel && sel.tipo === 'bairro') ativo = c.bairro === sel.id;
    if (sel && sel.tipo === 'forania') ativo = c.paroquia.forania === sel.id;
    if (sel && sel.tipo === 'igreja') ativo = c.id === sel.id || c.paroquia.id === igreja[sel.id].paroquia.id;
    const e = m.getElement(); if (!e) return;
    e.classList.toggle('apagado', !ativo);
    e.classList.toggle('destaque', !!(sel && ativo && sel.tipo !== 'forania'));
    e.classList.toggle('sel', !!(sel && sel.tipo === 'igreja' && sel.id === c.id));
    m.setZIndexOffset(ativo ? 1000 : 0);
  });
}
const atualizaPinos = () => document.getElementById('map').classList.toggle('hide-pinlbl', map.getZoom() < 14);
map.on('zoomend', atualizaPinos);

// Janelas de opção (não navegam sozinhas)
const botao = (s, t, principal) => `<button class="opt${principal?' pri':''}" data-sel='${JSON.stringify(s)}'>${t}</button>`;
function abrirJanela(latlng, html){
  L.popup({className:'janela', maxWidth:Math.min(290, innerWidth-60), minWidth:Math.min(230, innerWidth-80), autoPanPaddingTopLeft: celular() ? [16,120] : [400,80], autoPanPaddingBottomRight: celular() ? [16,(document.getElementById('painel').offsetHeight||64)+16] : [24,24]}).setLatLng(latlng).setContent(html).openOn(map);
}
function abrirJanelaIgreja(c){
  const p = c.paroquia;
  abrirJanela(c.pos, `<div class="j-eyebrow"><span class="sw" style="background:${corGrupo(p.id)}"></span>${c.matriz?'Igreja matriz':'Comunidade'}</div>
    <div class="j-title">${esc(c.nome)}</div>
    <div class="j-sub">${esc(c.local)}${c.ano?' · desde '+c.ano:''}<br>${esc(p.nome)}</div>
    ${c.aprox?'<div class="j-note">Posição aproximada (dentro do bairro)</div>':'<div class="j-ok">Localização no mapa conferida</div>'}
    <div class="j-acts">${botao({tipo:'igreja',id:c.id},'Ver igreja',true)}${botao({tipo:'paroquia',id:p.id},'Ver paróquia')}</div>`);
}
function abrirJanelaBairro(pr, latlng){
  const ps = pr.paroquias.map(id => paroquia[id]), n = igrejas.filter(c => c.bairro === pr.bairro).length;
  abrirJanela(latlng, `<div class="j-eyebrow">Bairro · ${esc(forania[pr.forania].nome.replace('Forania ',''))}</div>
    <div class="j-title">${esc(pr.bairro)}</div>
    <div class="j-sub">${ps.map(p => `<span class="sw" style="background:${corGrupo(p.id)}"></span>${esc(p.nome)}`).join('<br>')}</div>
    ${pr.situacao==='estimado'?'<div class="j-note">Paróquia estimada pelo bairro vizinho</div>':''}
    <div class="j-acts">${botao({tipo:'bairro',id:pr.bairro}, n ? `Ver igrejas do bairro (${n})` : 'Ver bairro', true)}${ps.map(p => botao({tipo:'paroquia',id:p.id}, ps.length>1 ? 'Ver '+esc(p.nome.replace(/^Paróquia\s+/,'')) : 'Ver paróquia')).join('')}</div>`);
}
document.getElementById('map').addEventListener('click', e => {
  const b = e.target.closest('.janela [data-sel]'); if (!b) return;
  map.closePopup(); selecionar(JSON.parse(b.dataset.sel));
});

function camadaDe(nome){ let r; camada.eachLayer(l => { if (l.feature.properties.bairro === nome) r = l; }); return r; }
function boundsDe(lista){ const b = L.latLngBounds([]); lista.forEach(f => b.extend(camadaDe(f.properties.bairro).getBounds())); return b; }

function selecionar(s, voar=true){
  sel = s && s.tipo === 'arq' ? null : s;
  camada.setStyle(estilo);
  if (sel && sel.tipo === 'bairro') camadaDe(sel.id).bringToFront();
  if (voar){
    if (!sel) map.flyToBounds(limites, {...pad(), duration:.6});
    else if (sel.tipo === 'bairro') map.flyToBounds(camadaDe(sel.id).getBounds(), {...pad(), maxZoom:15, duration:.6});
    else if (sel.tipo === 'paroquia') map.flyToBounds(boundsDe(paroquia[sel.id].bairros), {...pad(), maxZoom:14, duration:.6});
    else if (sel.tipo === 'igreja'){ const c = igreja[sel.id]; if (c.pos) map.flyToBounds(L.latLngBounds([c.pos, c.pos]), {...pad(), maxZoom:16, duration:.6}); else map.flyToBounds(boundsDe(paroquia[c.paroquia.id].bairros), {...pad(), maxZoom:14, duration:.6}); }
    else if (sel.tipo === 'forania') map.flyToBounds(boundsDe(bairros.filter(b => b.properties.forania === sel.id)), {...pad(), duration:.6});
  }
  estiloIgrejas(); atualizaPinos();
  document.getElementById('map').classList.toggle('com-pinos', !!(sel && sel.tipo !== 'forania'));
  render();
}


function crumbs(itens){
  return `<nav class="crumbs" aria-label="Hierarquia">${itens.map((it,i) => (i? '<span class="sep">›</span>':'') + (it.s ? `<button data-sel='${JSON.stringify(it.s)}'>${esc(it.t)}</button>` : `<span>${esc(it.t)}</span>`)).join('')}</nav>`;
}
const pill = est => est ? '<span class="pill warn"><i></i>Estimado por vizinhança</span>' : '<span class="pill ok"><i></i>Confirmado pelo site da Arquidiocese</span>';
const linhaParoquia = p => `<li><button data-sel='${JSON.stringify({tipo:'paroquia',id:p.id})}'><span class="sw" style="background:${modo==='forania'?CORES_FORANIA[p.forania]:corGrupo(p.id)}"></span><span class="name">${esc(p.nome)}</span><span class="meta">${p.bairros.length} bairro${p.bairros.length>1?'s':''}</span></button></li>`;
const linhaBairro = b => { const pr=b.properties; if (pr.principal !== sel.id) return `<li><button data-sel='${JSON.stringify({tipo:'bairro',id:pr.bairro})}'><span class="sw" style="border:1.5px dashed ${corGrupo(sel.id)};box-sizing:border-box"></span><span class="name">${esc(pr.bairro)}</span><span class="meta">divide com ${esc(paroquia[pr.principal].nome.replace(/^Paróquia\s+/,''))}</span></button></li>`; return `<li><button data-sel='${JSON.stringify({tipo:'bairro',id:pr.bairro})}'><span class="sw" style="background:${corGrupo(pr.grupo)};opacity:${pr.situacao==='estimado'?.45:1}"></span><span class="name">${esc(pr.bairro)}</span><span class="meta">${pr.situacao==='estimado'?'estimado':pr.situacao} · ${fmt(pr.pop)} hab.</span></button></li>`; };
const ARQ = {t:'Arquidiocese', s:{tipo:'arq'}};
const linhaComunidade = (c, comParoquia) => `<li><button data-sel='${JSON.stringify({tipo:'igreja',id:c.id})}'><span class="ico">${ICONE(corGrupo(c.paroquia.id), false)}</span><span class="name">${c.matriz?'<b>Matriz</b> · ':''}${esc(c.nome)}<br><small style="color:var(--muted)">${comParoquia?esc(c.paroquia.nome):esc(c.local)+(c.bairro&&c.bairro!==c.local?' · '+esc(c.bairro):'')+(c.bairro?'':' · bairro não identificado')}</small></span><span class="meta">${c.ano||''}</span></button></li>`;
const legenda = `<div class="legend-key"><span><i class="k-solid"></i>Bairro confirmado</span><span><i class="k-est"></i>Estimado</span><span class="k-pin">${ICONE('var(--muted)', false)}Igreja</span></div>`;

function render(){
  let h = '';
  if (!sel){
    const nB = bairros.length, nC = bairros.filter(b => b.properties.situacao !== 'estimado').length, nCom = Object.values(paroquia).reduce((a,p)=>a+p.comunidades.length,0);
    h += crumbs([{t:'Arquidiocese de Florianópolis'}]);
    h += `<div class="eyebrow">Visão geral</div><h2>Ilha de Santa Catarina</h2><p class="note" style="margin-top:0">Toque num bairro ou no desenho de uma igreja para abrir as opções. Use o seletor no topo para colorir por paróquia ou por forania.</p>`;
    h += `<div class="stats"><div><b>${H.foranias.length}</b><small>Foranias</small></div><div><b>${Object.keys(paroquia).length}</b><small>Paróquias</small></div><div><b>${nCom}</b><small>Igrejas e comunidades</small></div></div>`;
    h += legenda;
    H.foranias.forEach(f => {
      h += `<h3><button class="crumbs" style="all:unset;cursor:pointer" data-sel='${JSON.stringify({tipo:'forania',id:f.id})}'><span class="sw" style="background:${CORES_FORANIA[f.id]};margin-right:6px;vertical-align:-1px"></span>${esc(f.nome)}</button></h3><ul class="list">${f.paroquias.map(linhaParoquia).join('')}</ul>`;
    });
    h += `<p class="note">${nC} de ${nB} bairros têm igreja matriz ou comunidade localizada. Os outros ${nB-nC} foram estimados pelo bairro vizinho. Paróquias e comunidades conforme o site da <a href="https://arquifln.org.br/organizacao/1070-2" target="_blank" rel="noopener">Arquidiocese</a>, lido em 21/11/2026; a ligação de cada comunidade ao bairro do IBGE foi feita à mão.</p>`;
  } else if (sel.tipo === 'forania'){
    const f = forania[sel.id];
    const bs = bairros.filter(b => b.properties.forania === f.id);
    h += crumbs([ARQ, {t:f.nome}]);
    h += `<h2>${esc(f.nome)}</h2><div class="stats"><div><b>${f.paroquias.length}</b><small>Paróquias</small></div><div><b>${bs.length}</b><small>Bairros</small></div><div><b>${fmt(Math.round(bs.reduce((a,b)=>a+b.properties.pop,0)/1000))} mil</b><small>Habitantes</small></div></div>`;
    h += `<h3>Paróquias</h3><ul class="list">${f.paroquias.map(linhaParoquia).join('')}</ul>`;
    if (f.outras.length) h += `<h3>Sem território (capelanias e reitoria)</h3><ul class="list">${f.outras.map(o => `<li><a class="ext" href="${o.fonte}" target="_blank" rel="noopener"><span class="sw" style="background:var(--muted);border-radius:50%;width:8px;height:8px"></span><span class="name">${esc(o.nome)}</span></a></li>`).join('')}</ul>`;
    h += `<p class="note">Fonte: <a href="${f.fonte}" target="_blank" rel="noopener">página da forania</a>.</p>`;
  } else if (sel.tipo === 'paroquia'){
    const p = paroquia[sel.id], f = forania[p.forania];
    const conf = p.bairros.filter(b => b.properties.situacao !== 'estimado'), est = p.bairros.filter(b => b.properties.situacao === 'estimado');
    h += crumbs([ARQ, {t:f.nome, s:{tipo:'forania',id:f.id}}, {t:'Paróquia'}]);
    h += `<h2>${esc(p.nome)}</h2>`;
    h += `<dl class="facts">${p.paroco?`<dt>Pároco</dt><dd>${esc(p.paroco)}</dd>`:''}${p.criada?`<dt>Criação</dt><dd>${esc(p.criada.replace(/^Criada (a|em) /,''))}</dd>`:''}<dt>Endereço</dt><dd>${esc(p.endereco)}</dd></dl>`;
    const semB = p.comunidades.filter(c => !c.bairro).length;
    h += `<h3>Matriz e comunidades (${p.comunidades.length})</h3><p class="note" style="margin:-2px 0 8px">Cada uma está marcada no mapa com o desenho de uma igreja${semB?`; ${semB} ainda sem localização aparece${semB>1?'m':''} só nesta lista`:''}. Toque numa para ver os detalhes.</p>`;
    h += `<ul class="list">${p.comunidades.map(c => linhaComunidade(c)).join('')}</ul>`;
    h += `<h3>Bairros confirmados</h3><ul class="list">${conf.map(linhaBairro).join('')}</ul>`;
    if (est.length) h += `<h3>Bairros estimados</h3><ul class="list">${est.map(linhaBairro).join('')}</ul>`;
    if (p.fonte) h += `<p class="note">Fonte: <a href="${p.fonte}" target="_blank" rel="noopener">página da paróquia</a>.</p>`;
  } else if (sel.tipo === 'igreja'){
    const c = igreja[sel.id], p = c.paroquia, f = forania[p.forania];
    h += crumbs([ARQ, {t:f.nome, s:{tipo:'forania',id:f.id}}, {t:p.nome, s:{tipo:'paroquia',id:p.id}}, {t:c.nome}]);
    h += `<div class="j-eyebrow" style="margin-top:10px">${ICONE(corGrupo(p.id), c.matriz)} ${c.matriz?'Igreja matriz':'Comunidade'}</div><h2>${esc(c.nome)}</h2>`;
    h += `<dl class="facts"><dt>Localidade</dt><dd>${esc(c.local)}</dd>${c.bairro?`<dt>Bairro</dt><dd>${esc(c.bairro)}</dd>`:''}${c.ano?`<dt>Desde</dt><dd>${c.ano}</dd>`:''}<dt>Paróquia</dt><dd>${esc(p.nome)}</dd><dt>Forania</dt><dd>${esc(f.nome)}</dd>${c.matriz?`<dt>Endereço</dt><dd>${esc(p.endereco)}</dd>`:''}</dl>`;
    h += c.pos ? `<p class="note">${c.aprox?'O marcador está numa posição aproximada, dentro do bairro. A igreja não foi encontrada no OpenStreetMap.':(c.posicao==='endereco'?'Marcador posicionado pelo endereço da paróquia.':'Marcador na posição da igreja, conforme o OpenStreetMap.')}</p>` : `<p class="note">Ainda sem localização no mapa.</p>`;
    h += `<div class="j-acts" style="margin-top:12px">${botao({tipo:'paroquia',id:p.id},'Ver paróquia e todas as igrejas',true)}${c.bairro?botao({tipo:'bairro',id:c.bairro},'Ver bairro '+esc(c.bairro)):''}</div>`;
    const outras = p.comunidades.filter(x => x !== c);
    h += `<h3>Outras igrejas da paróquia (${outras.length})</h3><ul class="list">${outras.map(x => linhaComunidade(x)).join('')}</ul>`;
  } else {
    const b = bairros.find(x => x.properties.bairro === sel.id), pr = b.properties, f = forania[pr.forania];
    const ps = pr.paroquias.map(id => paroquia[id]);
    h += crumbs([ARQ, {t:f.nome, s:{tipo:'forania',id:f.id}}, {t:ps[0].nome, s:{tipo:'paroquia',id:ps[0].id}}, {t:pr.bairro}]);
    h += `<h2>${esc(pr.bairro)}</h2>${pill(pr.situacao==='estimado')}`;
    h += `<div class="stats"><div><b>${fmt(pr.pop)}</b><small>Habitantes</small></div><div><b style="font-size:18px;padding-top:6px">${esc(pr.distrito)}</b><small>Distrito</small></div></div>`;
    h += `<h3>${ps.length>1?'Paróquias presentes no bairro':'Paróquia'}</h3><ul class="list">${ps.map(linhaParoquia).join('')}</ul>`;
    if (ps.length > 1) h += `<p class="note">O mapa pinta o bairro com a cor de ${esc(ps[0].nome)}${pr.situacao==='matriz'?', que tem a matriz aqui':', que tem mais comunidades aqui'}.</p>`;
    const cs = comunidadesEm(pr.bairro);
    if (cs.length) h += `<h3>Igrejas no bairro (${cs.length})</h3><ul class="list">${cs.map(c => linhaComunidade(c, true)).join('')}</ul>`;
    if (pr.situacao === 'estimado') h += `<p class="note">Nenhuma comunidade do site da Arquidiocese foi localizada neste bairro. A estimativa segue a paróquia de ${esc(pr.referencia)}, a ${pr.saltos} bairro${pr.saltos>1?'s':''} de distância.</p>`;
    h += `<h3>Forania</h3><ul class="list"><li><button data-sel='${JSON.stringify({tipo:'forania',id:f.id})}'><span class="sw" style="background:${CORES_FORANIA[f.id]}"></span><span class="name">${esc(f.nome)}</span><span class="meta">${f.paroquias.length} paróquias</span></button></li></ul>`;
  }
  const c = document.getElementById('conteudo');
  c.replaceChildren(el(h));
  c.parentElement.scrollTop = 0;
  document.getElementById('alca-titulo').textContent = !sel ? 'Ilha de Santa Catarina' : sel.tipo==='bairro' ? sel.id : sel.tipo==='paroquia' ? paroquia[sel.id].nome : sel.tipo==='igreja' ? igreja[sel.id].nome : forania[sel.id].nome;
  document.getElementById('voltar').hidden = !sel;
  if (celular() && sel) abrirGaveta(true);
}

document.getElementById('conteudo').addEventListener('click', e => {
  const b = e.target.closest('[data-sel]'); if (b) selecionar(JSON.parse(b.dataset.sel));
});

function setModo(m){
  modo = m;
  document.getElementById('modo-paroquia').setAttribute('aria-pressed', m==='paroquia');
  document.getElementById('modo-forania').setAttribute('aria-pressed', m==='forania');
  camada.setStyle(estilo); render();
}
document.getElementById('modo-paroquia').onclick = () => setModo('paroquia');
document.getElementById('modo-forania').onclick = () => setModo('forania');

// Busca
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const indice = [
  ...bairros.map(b => ({t:b.properties.bairro, d:'Bairro · '+paroquia[b.properties.principal].nome, s:{tipo:'bairro',id:b.properties.bairro}})),
  ...igrejas.map(c => ({t:c.nome+' ('+c.local+')', d:(c.matriz?'Matriz · ':'Igreja · ')+c.paroquia.nome, s:{tipo:'igreja',id:c.id}})),
  ...Object.values(paroquia).map(p => ({t:p.nome, d:forania[p.forania].nome, s:{tipo:'paroquia',id:p.id}})),
  ...H.foranias.map(f => ({t:f.nome, d:'Forania', s:{tipo:'forania',id:f.id}}))
];
const inp = document.getElementById('busca'), ul = document.getElementById('sugestoes');
inp.addEventListener('input', () => {
  const q = norm(inp.value.trim());
  if (!q){ ul.hidden = true; return; }
  const r = indice.filter(i => norm(i.t).includes(q)).slice(0,8);
  ul.innerHTML = r.length ? r.map(i => `<li><button data-sel='${JSON.stringify(i.s)}'>${esc(i.t)}<br><small>${esc(i.d)}</small></button></li>`).join('') : '<li style="padding:6px 8px;color:var(--muted)">Nada encontrado</li>';
  ul.hidden = false;
});
ul.addEventListener('click', e => { const b = e.target.closest('[data-sel]'); if (!b) return; selecionar(JSON.parse(b.dataset.sel)); ul.hidden = true; inp.value=''; inp.blur(); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) ul.hidden = true; });

// Gaveta no celular
const painel = document.getElementById('painel'), alca = document.getElementById('alca');
function medeFolha(){ document.querySelector('.app').style.setProperty('--sheet-h', painel.offsetHeight + 'px'); }
function abrirGaveta(aberta){ painel.classList.toggle('collapsed', !aberta); alca.setAttribute('aria-expanded', aberta); document.getElementById('alca-ico').textContent = aberta ? 'Recolher' : 'Ver detalhes'; requestAnimationFrame(medeFolha); setTimeout(medeFolha, 300); }
new ResizeObserver(medeFolha).observe(painel);
document.getElementById('voltar').onclick = () => { map.closePopup(); selecionar(null); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sel) { map.closePopup(); selecionar(null); } });
alca.onclick = () => abrirGaveta(painel.classList.contains('collapsed'));

render(); estiloIgrejas(); atualizaPinos();
if (celular()) abrirGaveta(false);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => location.reload());
})();
</script>
