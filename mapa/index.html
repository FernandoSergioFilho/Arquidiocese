/* Layout no estilo Google Maps: mapa em tela cheia, caixa de busca no alto à esquerda,
   painel lateral branco (desktop) ou folha que sobe de baixo (celular), chips de filtro e zoom no canto. */
:root{
  --water:#aadaff; --land:#f5f3f0; --land-line:#d6d9dc;
  --panel:#ffffff; --panel-2:#f1f3f4; --fg:#202124; --muted:#5f6368; --rule:#e8eaed;
  --accent:#1a73e8; --accent-ink:#ffffff; --accent-soft:#e8f0fe; --legend:#5f6368;
  --ok:#188038; --warn:#b06000; --chip:#f1f3f4; --label-halo:#ffffff;
  --shadow:0 1px 2px rgb(60 64 67/.3),0 2px 6px 2px rgb(60 64 67/.15);
  --font:"Roboto",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --water:#17263c; --land:#242f3e; --land-line:#3b4656;
  --panel:#202124; --panel-2:#2d2e31; --fg:#e8eaed; --muted:#9aa0a6; --rule:#3c4043;
  --accent:#8ab4f8; --accent-ink:#202124; --accent-soft:#2a3a52; --legend:#9aa0a6;
  --ok:#81c995; --warn:#fdd663; --chip:#2d2e31; --label-halo:#17263c;
  --shadow:0 1px 2px rgb(0 0 0/.5),0 2px 6px 2px rgb(0 0 0/.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --water:#17263c; --land:#242f3e; --land-line:#3b4656;
  --panel:#202124; --panel-2:#2d2e31; --fg:#e8eaed; --muted:#9aa0a6; --rule:#3c4043;
  --accent:#8ab4f8; --accent-ink:#202124; --accent-soft:#2a3a52; --legend:#9aa0a6;
  --ok:#81c995; --warn:#fdd663; --chip:#2d2e31; --label-halo:#17263c;
  --shadow:0 1px 2px rgb(0 0 0/.5),0 2px 6px 2px rgb(0 0 0/.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--water);color:var(--fg);font-family:var(--font);font-size:14px;overflow:hidden}
.app{position:relative;height:100%}
#map{position:absolute;inset:0;background:var(--water)}
.leaflet-container{background:var(--water);font-family:var(--font)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Busca e chips */
.topbar{position:absolute;z-index:900;top:12px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start;pointer-events:none}
.topbar > *{pointer-events:auto}
.search{position:relative;width:384px;flex:none;background:var(--panel);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center}
.search .logo{flex:none;display:grid;place-items:center;width:44px;height:48px;padding-left:4px}
.search input{flex:1;min-width:0;font:16px var(--font);height:48px;padding:0 16px 0 2px;border:0;background:transparent;color:var(--fg);outline:none}
.search input::placeholder{color:var(--muted)}
.search:focus-within{box-shadow:0 2px 4px rgb(60 64 67/.3),0 4px 12px 4px rgb(60 64 67/.15)}
.search ul{position:absolute;z-index:1000;top:calc(100% + 6px);left:0;right:0;margin:0;padding:6px 0;list-style:none;background:var(--panel);border-radius:12px;max-height:340px;overflow:auto;box-shadow:var(--shadow)}
.search li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:9px 18px;cursor:pointer;font-size:14px}
.search li button:hover,.search li button:focus-visible{background:var(--chip)}
.search li small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:7px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:17px;background:var(--panel);color:var(--fg);font:500 14px var(--font);box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--panel-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
#voltar{background:var(--accent);color:var(--accent-ink)}
#voltar[hidden]{display:none}

/* Painel lateral */
aside{position:absolute;z-index:800;top:0;bottom:0;left:0;width:408px;display:flex;flex-direction:column;background:var(--panel);box-shadow:0 0 16px rgb(0 0 0/.18);overflow:hidden}
.handle{display:none}
.body{overflow:auto;min-height:0;flex:1;padding:76px 24px 24px max(24px,env(safe-area-inset-left,0px))}
.crumbs{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;font-size:12px;color:var(--muted)}
.crumbs button{all:unset;cursor:pointer;color:var(--accent)}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{opacity:.6}
.eyebrow{margin-top:14px;font-size:14px;color:var(--muted)}
aside h2{font:400 22px/1.3 var(--font);margin:6px 0 4px;text-wrap:balance;color:var(--fg)}
aside h3{font:500 16px var(--font);color:var(--fg);margin:22px -24px 6px;padding:16px 24px 0;border-top:1px solid var(--rule)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:2px 0}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.list{display:flex;flex-direction:column;margin:0 -24px;padding:0;list-style:none}
.list button,.list a.ext{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:center;width:100%;padding:10px 24px;cursor:pointer;color:var(--fg)}
.list button:hover,.list button:focus-visible,.list a.ext:hover{background:var(--chip)}
.list .meta{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.list .name{min-width:0;line-height:1.35}
.list small{font-size:13px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:14px 0 0;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.facts a{color:var(--accent);text-decoration:none}
.note{font-size:13px;line-height:1.5;color:var(--muted);margin:10px 0 0}
.note a{color:var(--accent);text-decoration:none}
.stats{display:flex;gap:0;margin:16px 0 0;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.stats div{flex:1;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-left:1px solid var(--rule)}
.stats div:first-child{border-left:0}
.stats b{font:500 22px/1.1 var(--font);font-variant-numeric:tabular-nums;color:var(--fg)}
.stats small{font-size:12px;color:var(--muted)}
.legend-key,.legend-tipos{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
.legend-key span,.legend-tipos span{display:inline-flex;gap:6px;align-items:center}
.k-solid{width:16px;height:10px;border-radius:3px;background:var(--muted)}
.k-area{width:16px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--muted) 60%,transparent)}
.k-vazio{width:16px;height:10px;border-radius:3px;background:var(--land);border:1px solid var(--land-line);box-sizing:border-box}
.k-est{width:16px;height:10px;border-radius:3px;border:1.5px dashed var(--muted);box-sizing:border-box;background:color-mix(in srgb,var(--muted) 25%,transparent)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.arvore{margin:12px -24px 0}
.arvore details{border-top:1px solid var(--rule)}
.arvore summary{list-style:none;display:flex;gap:10px;align-items:center;padding:12px 24px;cursor:pointer}
.arvore summary::-webkit-details-marker{display:none}
.arvore summary::before{content:"";width:7px;height:7px;flex:none;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.arvore details[open] > summary::before{transform:rotate(45deg)}
.arvore summary:hover{background:var(--chip)}
.arvore .f > summary{font-weight:500;font-size:15px}
.arvore .p{border-top:0}
.arvore .p > summary{padding-left:40px;font-size:14px}
.arvore .p .list{margin:0}
.arvore .p .list button{padding-left:60px}
.arvore .meta{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.arvore .sem{padding:6px 24px 10px 40px;font-size:13px;color:var(--muted)}
@media (max-width:760px){.arvore{margin:12px -20px 0}.arvore summary{padding:12px 20px}.arvore .p > summary{padding-left:34px}.arvore .p .list button{padding-left:50px}}

/* Mapa: rótulos, marcadores, janelas */
.leaflet-control-zoom{border:0!important;box-shadow:var(--shadow)!important;border-radius:8px!important;overflow:hidden}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--muted)!important;border-color:var(--rule)!important;width:40px!important;height:40px!important;line-height:40px!important;font:400 22px var(--font)!important}

.lbl{background:transparent;border:0;box-shadow:none;padding:0;font:500 11px var(--font);color:var(--fg);
  text-shadow:0 0 2px var(--label-halo),0 0 2px var(--label-halo),0 0 3px var(--label-halo);white-space:nowrap}
.lbl::before{display:none}
.leaflet-marker-icon.lbl{width:auto!important;height:auto!important;transform-origin:center;margin:0!important;translate:-50% -50%}
.lbl.big{font:400 12px var(--font);letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--fg) 55%,var(--water))}
.hide-lbl .lbl:not(.big){display:none}
.com-pinos .lbl:not(.big){display:none}
.tip{font:13px var(--font);border-radius:8px;border:0;background:var(--panel);color:var(--fg);box-shadow:var(--shadow);padding:8px 12px}
.tip b{display:block;font-size:14px;font-weight:500}
.tip::before{display:none}
.pin{display:flex;align-items:flex-start;gap:2px;white-space:nowrap;font:500 12px var(--font);color:var(--fg);cursor:pointer}
.pin svg{flex:none}
.pin span{padding-top:6px;text-shadow:0 0 2px var(--label-halo),0 0 2px var(--label-halo),0 0 3px var(--label-halo)}
.pin.t-matriz span,.pin.t-catedral span{padding-top:10px;font-weight:700}
.hide-pinlbl .pin span{display:none}
.hide-pinlbl .destaque .pin span{display:inline}
.apagado .pin{opacity:.25}
.apagado .pin span{display:none}
.sel .pin svg{transform:scale(1.3);transform-origin:bottom center}
.foco .pin svg{transform:scale(1.45);transform-origin:bottom center;transition:transform .15s}
.foco .pin span{display:inline!important;font-weight:700}
.list li.foco > button{background:var(--accent-soft);border-radius:8px}
.ico{display:inline-flex;flex:none;width:26px;justify-content:center}
.janela .leaflet-popup-content-wrapper{background:var(--panel);color:var(--fg);border-radius:8px;box-shadow:var(--shadow)}
.janela .leaflet-popup-tip{background:var(--panel);box-shadow:none}
.janela .leaflet-popup-content{margin:14px 16px;font:14px/1.45 var(--font)}
.janela a.leaflet-popup-close-button{color:var(--muted);font-size:22px;padding:8px 10px 0 0;width:auto;height:auto}
.j-eyebrow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.j-title{font:500 18px/1.25 var(--font);margin:6px 0 2px;padding-right:16px;color:var(--fg)}
.j-sub{color:var(--muted);font-size:13px}
.j-sub .sw{width:9px;height:9px;margin-right:6px;vertical-align:0}
.j-ok{margin-top:8px;font-size:12px;color:var(--ok)}
.j-note{margin-top:8px;font-size:12px;color:var(--warn)}
.j-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.opt{font:500 14px var(--font);height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--rule);background:var(--panel);color:var(--accent);cursor:pointer}
.opt:hover{background:var(--accent-soft)}

<script>
(async function(){
const CORES_ILHA = {
  desterro:'#a3303f', 'santo-antonio':'#8a6a3b', 'santa-teresinha':'#e58fa8', lourdes:'#e07b39', 'boa-viagem':'#c9a227',
  lapa:'#b04aa0', 'sagrado-coracao':'#7e57c2', lagoa:'#1f8a9e', necessidades:'#3b7a3e', guadalupe:'#2e6fd1',
  ingleses:'#49b0e0', trindade:'#4f5d7e', 'sao-francisco-xavier':'#7bb047'
};
const CORES_FORANIA = {'centro-sul':'#c2563a', norte:'#2f6fb0', continente:'#2a9d8f', 'sao-jose':'#8e5bb5', barreiros:'#d4a017',
  biguacu:'#3f8f3a', palhoca:'#d1495b', 'santo-amaro':'#6b8e23', tijucas:'#1b7fa6', itapema:'#e07a2e', camboriu:'#b5527a', itajai:'#4c5fd5', brusque:'#8a6a3b'};
const fmt = n => n.toLocaleString('pt-BR');
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const semPar = n => n.replace(/^Paróquia\s+/, '');

let D;
try { D = await (await fetch('dados.json')).json(); }
catch(e){ document.getElementById('conteudo').innerHTML = '<p class="note">Não foi possível carregar os dados do mapa. Recarregue a página.</p>'; return; }

// ---------- Dados ----------
const H = D.hierarquia;
const forania = {}, paroquia = {};
let k = 0;
H.foranias.forEach(f => { forania[f.id] = f; f.paroquias.forEach(p => { p.forania = f.id; paroquia[p.id] = p; p.cor = CORES_ILHA[p.id] || `hsl(${Math.round((k++ * 137.508 + 20) % 360)} ${58 + (k%3)*8}% ${42 + (k%4)*5}%)`; }); });
const cor = id => paroquia[id] ? paroquia[id].cor : '#888';

const igrejas = [];
Object.values(paroquia).forEach(p => p.comunidades.forEach((c, j) => { c.id = p.id + '~' + j; c.paroquia = p; igrejas.push(c); }));
// município de cada igreja
igrejas.forEach(c => {
  const p = c.paroquia;
  c.mun = c.municipio || p.municipio;
});
igrejas.forEach(c => { if (c.lat) c.pos = [c.lat, c.lng]; });
const igreja = Object.fromEntries(igrejas.map(c => [c.id, c]));

const TIPOS = {
  catedral:{rot:'Catedral', g:'<path d="M12 2.5v3.2M10.6 3.9h2.8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M4.5 19.5V10l2-2.2 2 2.2v9.5zM15.5 19.5V10l2-2.2 2 2.2v9.5zM8.5 19.5v-6.2a3.5 3.5 0 0 1 7 0v6.2z" fill="#fff"/>'},
  matriz:{rot:'Igreja matriz', g:'<path d="M12 2.5v3.4M10.5 4h3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M10 19.5V9.5l2-2.4 2 2.4v10zM5.5 19.5v-6l4.5-3.2v9.2zM18.5 19.5v-6L14 10.3v9.2z" fill="#fff"/>'},
  igreja:{rot:'Igreja', g:'<path d="M12 3v3.4M10.5 4.5h3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M6 19.5v-7.8l6-4.7 6 4.7v7.8h-4.2v-3.6a1.8 1.8 0 0 0-3.6 0v3.6z" fill="#fff"/>'},
  capela:{rot:'Capela / comunidade', g:'<path d="M12 5v3.2M10.6 6.4h2.8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M7.5 19v-6l4.5-3.6 4.5 3.6v6z" fill="#fff"/>'},
  santuario:{rot:'Santuário', g:'<circle cx="12" cy="12" r="6.6" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M12 7.2v9.6M8.6 10.6h6.8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>'},
};
igrejas.forEach(c => {
  const n = (c.nome + ' ' + (c.nome_osm || '')).toLowerCase();
  c.tipo = (c.paroquia.id === 'desterro' && c.matriz) ? 'catedral' : /santu[aá]rio/.test(n) ? 'santuario' : c.matriz ? 'matriz'
    : (/^igreja|\bigreja\b/.test(n) && !/^capela/.test(c.nome_osm || '')) ? 'igreja' : 'capela';
});
const ICONE = (cr, tipo, tam=22) => `<svg viewBox="0 0 24 24" width="${tam}" height="${tam}" aria-hidden="true"><circle cx="12" cy="12" r="11.5" style="fill:${cr}"/>${TIPOS[tipo].g}</svg>`;
const GRANDE = t => t === 'catedral' || t === 'matriz' || t === 'santuario';
const GOTA = (cr, tipo) => {
  const w = GRANDE(tipo) ? 36 : 26, h = Math.round(w*1.36);
  return `<svg viewBox="0 0 32 44" width="${w}" height="${h}" aria-hidden="true"><ellipse cx="16" cy="42" rx="5" ry="1.6" fill="rgba(0,0,0,.28)"/><path d="M16 1.2C7.9 1.2 1.4 7.6 1.4 15.6c0 10.4 14.6 25 14.6 25s14.6-14.6 14.6-25C30.6 7.6 24.1 1.2 16 1.2z" style="fill:${cr}" stroke="#fff" stroke-width="${GRANDE(tipo)?2:1.6}"/><g transform="translate(4 3.4)">${TIPOS[tipo].g}</g></svg>`;
};
const POSICAO = {osm:['ok','Localização conferida no OpenStreetMap'], endereco:['ok','Posicionada pelo endereço'], rua:['ok','Posicionada pela rua do endereço publicado pela paróquia'], rua_google:['ok','Posicionada pela rua do endereço do Google (rua conferida no OpenStreetMap)'], cnefe:['ok','Localização do Censo 2022 (IBGE)'], localidade:['warn','Posição aproximada (centro da localidade)'], bairro:['warn','Posição aproximada (centro do bairro)'], aprox:['warn','Posição aproximada (perto da matriz)']};
const posicaoDe = c => POSICAO[c.posicao] || POSICAO[c.lat ? 'osm' : 'aprox'];
const PREFIXO = {catedral:'Catedral', matriz:'Igreja', igreja:'Igreja', capela:'Capela', santuario:'Santuário'};
const linkGoogle = c => {
  const nome = /^(igreja|capela|santu[aá]rio|catedral|par[oó]quia|gruta|orat[oó]rio)\b/i.test(c.nome.replace(/^[“"]/,'')) ? c.nome : PREFIXO[c.tipo] + ' ' + c.nome;
  const q = [nome, c.local && c.local !== c.mun ? c.local : null, c.mun, 'SC'].filter(Boolean).join(', ');
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
};
const botaoGoogle = c => `<a class="opt" href="${linkGoogle(c)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Procurar no Google Maps</a>`;

// ---------- Mapa ----------
let modo = 'paroquia', sel = null; // sel: {tipo:'paroquia'|'forania'|'igreja'|'arq', id}
const map = L.map('map', {zoomControl:false, attributionControl:true, zoomSnap:.25, minZoom:8, maxZoom:17, preferCanvas:true});
L.control.zoom({position:'bottomright'}).addTo(map);
const canvas = L.canvas({padding:.3, tolerance:2});
const celular = () => matchMedia('(max-width:760px)').matches;
const pad = () => celular()
  ? {paddingTopLeft:[16, 120], paddingBottomRight:[16, (document.getElementById('painel').offsetHeight||64) + 16]}
  : {paddingTopLeft:[430, 70], paddingBottomRight:[70, 28]};
map.attributionControl.setPrefix(false).addAttribution('Mapa: © OpenStreetMap, Protomaps · Igrejas: Arquidiocese, OpenStreetMap, IBGE');
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();

// ---------- Mapa-base (OpenStreetMap, recorte da região em base.pmtiles), com cores no estilo do Google Maps ----------

const fundoReserva = () => L.geoJSON(D.fundo, {renderer:canvas, interactive:false, style:f=>({stroke:!!f.properties.fora, color:tok('--land-line'), weight:.8, fillColor:tok('--land'), fillOpacity:1})}).addTo(map);
// Os tiles vêm em pacotes JSON (base_0: zoom < 9; base9_X_Y: zooms 9-10 por tile do zoom 9; base_X_Y: zoom 11 e seus filhos),
// baixados só quando a região aparece na tela. Cada tile está em base64, comprimido (gzip).
const BASE_TPL = 'https://mapa-base.invalid/{z}/{x}/{y}.mvt', pacotes = {};
function pacote(nome){ return pacotes[nome] || (pacotes[nome] = fetch('base/' + nome + '.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))); }
async function tileBase(z, x, y){
  const nome = z < 9 ? 'base_0' : z < 11 ? `base9_${x >> (z - 9)}_${y >> (z - 9)}` : `base_${x >> (z - 11)}_${y >> (z - 11)}`;
  const b64 = (await pacote(nome))[`${z}/${x}/${y}`];
  if (!b64) return new ArrayBuffer(0);
  const gz = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
  return await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
}
function poeMapaBase(){
  if (!window.protomapsL || !window.DecompressionStream) { fundoReserva(); return; }
  const f0 = window.fetch.bind(window);
  window.fetch = (u, o) => {
    const m = typeof u === 'string' && /^https:\/\/mapa-base\.invalid\/(\d+)\/(\d+)\/(\d+)\.mvt$/.exec(u);
    return m ? tileBase(+m[1], +m[2], +m[3]).then(b => new Response(b)) : f0(u, o);
  };
  const fl = sabor(escuroAtivo());
  // Desempenho: nomes de rua só bem de perto; sem redesenhar durante o zoom; resolução no máximo 1,5x (telas 3x pesam 4x mais)
  const rotulos = protomapsL.labelRules(fl, 'pt').map(r => r.dataLayer === 'roads' ? {...r, minzoom:Math.max(r.minzoom || 0, 15)} : r);
  camadaBase = protomapsL.leafletLayer({url:BASE_TPL, maxDataZoom:13, paintRules:protomapsL.paintRules(fl), labelRules:rotulos, backgroundColor:fl.background, attribution:'',
    tileDelay:0, updateWhenZooming:false, updateWhenIdle:true, keepBuffer:1});

  camadaBase.addTo(map);
}

function atualizaRotulos(){
  camadaRotulos.clearLayers();
  const z = map.getZoom(), b = map.getBounds().pad(.1);
  const lista = camadaBase ? [] : rotMun;  // com o mapa-base, os nomes de lugar já vêm dele
  const ocupados = [];  // evita rótulos sobrepostos
  lista.forEach(r => {
    if (!b.contains(r.p)) return;
    const pt = map.latLngToContainerPoint(r.p), w = r.t.length * (r.big ? 8.5 : 6) / 2 + 6, h = r.big ? 10 : 8;
    const caixa = [pt.x - w, pt.y - h, pt.x + w, pt.y + h];
    if (ocupados.some(o => !(caixa[2] < o[0] || caixa[0] > o[2] || caixa[3] < o[1] || caixa[1] > o[3]))) return;
    ocupados.push(caixa);
    camadaRotulos.addLayer(L.marker(r.p, {interactive:false, keyboard:false, icon:L.divIcon({className:'lbl' + (r.big?' big':''), html:esc(r.t), iconSize:null})}));

function ativoIgreja(c){
  if (!sel) return true;
  if (sel.tipo === 'paroquia') return c.paroquia.id === sel.id;
  if (sel.tipo === 'forania') return c.paroquia.forania === sel.id;

const corPino = c => modo === 'forania' ? CORES_FORANIA[c.paroquia.forania] : cor(c.paroquia.id);

  const m = L.marker(c.pos, {
    icon: L.divIcon({className:'', html:`<div class="pin t-${c.tipo}">${GOTA(corPino(c), c.tipo)}<span>${esc(c.nome)}</span></div>`, iconSize:null, iconAnchor: GRANDE(c.tipo) ? [18,48] : [13,35]}),
    keyboard:false, title:c.nome

function atualizaIgrejas(){
  const z = map.getZoom(), b = map.getBounds().pad(.15);
  const foco = sel && sel.tipo !== 'forania';
  const quer = new Set();
  for (const c of igrejas){
    if (!c.pos || !b.contains(c.pos)) continue;
    const at = ativoIgreja(c);
    const visivelPorZoom = GRANDE(c.tipo) ? z >= 9 : c.tipo === 'igreja' ? z >= 11.5 : z >= 12.5;
    if ((foco && at) || (visivelPorZoom && (at || z >= 12.5))) quer.add(c.id);
  }
  for (const id in marcador) if (!quer.has(id) && camadaIgrejas.hasLayer(marcador[id])) camadaIgrejas.removeLayer(marcador[id]);
  for (const id of quer){
    const c = igreja[id], m = marcador[id] || (marcador[id] = criaMarcador(c));

    h += legenda;
    h += `<h3>Foranias</h3><ul class="list">${H.foranias.map(linhaForania).join('')}</ul>`;
    h += `<p class="note">Paróquias e comunidades conforme o site da <a href="https://arquifln.org.br/organizacao/1070-2" target="_blank" rel="noopener">Arquidiocese</a>, lido em 21/11/2026. A Arquidiocese não publica os limites das paróquias; por isso o mapa mostra só as igrejas, na cor da sua paróquia.</p>`;
  } else if (sel.tipo === 'forania'){
    const f = forania[sel.id], ni = f.paroquias.reduce((a,p)=>a+p.comunidades.length,0), ms = municipiosDe(f.paroquias);
    h += crumbs([ARQ, {t:f.nome}]);
    h += `<h2>${esc(f.nome)}</h2><div class="eyebrow" style="margin-top:0">${esc(ms.join(', '))}</div>`;
    h += `<div class="stats"><div><b>${f.paroquias.length}</b><small>Paróquias</small></div><div><b>${ni}</b><small>Igrejas</small></div><div><b>${ms.length}</b><small>Município${ms.length>1?'s':''}</small></div></div>`;
    h += `<h3>Paróquias</h3><ul class="list">${f.paroquias.map(linhaParoquia).join('')}</ul>`;
    if (f.outras.length) h += `<h3>Sem território (capelanias, reitoria, santuário)</h3><ul class="list">${f.outras.map(o => `<li><a class="ext" href="${o.fonte}" target="_blank" rel="noopener"><span class="sw" style="background:var(--muted);border-radius:50%;width:8px;height:8px"></span><span class="name">${esc(o.nome)}<br><small style="color:var(--muted)">${esc(o.municipio||'')}</small></span></a></li>`).join('')}</ul>`;
    h += `<p class="note">Fonte: <a href="${f.fonte}" target="_blank" rel="noopener">página da forania</a>.</p>`;
  } else if (sel.tipo === 'paroquia'){
    const p = paroquia[sel.id], f = forania[p.forania];
    h += crumbs([ARQ, {t:f.nome, s:{tipo:'forania',id:f.id}}, {t:'Paróquia'}]);
    h += `<h2>${esc(p.nome)}</h2>`;
    h += `<dl class="facts"><dt>Município</dt><dd>${esc(p.municipio)}</dd>${p.paroco?`<dt>Pároco</dt><dd>${esc(p.paroco)}</dd>`:''}${p.criada?`<dt>Criação</dt><dd>${esc(p.criada.replace(/^Criada (a|em) /,''))}</dd>`:''}<dt>Endereço</dt><dd>${esc(p.endereco)}</dd>${(p.instagram||[]).length?`<dt>Instagram</dt><dd>${p.instagram.map(i => `<a href="https://www.instagram.com/${encodeURIComponent(i)}/" target="_blank" rel="noopener">@${esc(i)}</a>`).join(', ')}</dd>`:''}${(p.sites||[]).length?`<dt>Site</dt><dd>${p.sites.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</a>`).join('<br>')}</dd>`:''}</dl>`;
    const sem = p.comunidades.filter(c => !c.pos).length;
    h += `<h3>Matriz e comunidades (${p.comunidades.length})</h3><p class="note" style="margin:-2px 0 8px">Todas marcadas no mapa${sem?`, menos ${sem} sem localização`:''}. Toque numa para ver os detalhes.</p>`;
    h += `<ul class="list" data-foco>${p.comunidades.map(c => linhaComunidade(c)).join('')}</ul>`;
    if (p.fonte) h += `<p class="note">Fonte: <a href="${p.fonte}" target="_blank" rel="noopener">página da paróquia</a>.</p>`;
  } else if (sel.tipo === 'igreja'){
    const c = igreja[sel.id], p = c.paroquia, f = forania[p.forania], [cl, txt] = posicaoDe(c);
    h += crumbs([ARQ, {t:f.nome, s:{tipo:'forania',id:f.id}}, {t:p.nome, s:{tipo:'paroquia',id:p.id}}]);
    h += `<div class="j-eyebrow" style="margin-top:12px">${ICONE(cor(p.id), c.tipo, 20)} ${TIPOS[c.tipo].rot}</div><h2>${esc(c.nome)}</h2>`;
    h += `<dl class="facts"><dt>Localidade</dt><dd>${esc(c.local)}</dd><dt>Município</dt><dd>${esc(c.mun)}</dd>${c.endereco_site?`<dt>Endereço</dt><dd>${esc(c.endereco_site)}</dd>`:''}${c.endereco_google?`<dt>Endereço (Google)</dt><dd>${esc(c.endereco_google)}</dd>`:''}${c.cnefe?`<dt>Censo 2022</dt><dd>${esc(c.cnefe)}</dd>`:''}${c.ano?`<dt>Desde</dt><dd>${c.ano}</dd>`:''}<dt>Paróquia</dt><dd>${esc(p.nome)}</dd><dt>Forania</dt><dd>${esc(f.nome)}</dd>${c.matriz?`<dt>Endereço</dt><dd>${esc(p.endereco)}</dd>`:''}</dl>`;
    h += `<p class="note" style="color:var(--${cl==='ok'?'ok':'warn'})">${txt}.</p>`;
    h += `<div class="j-acts" style="margin-top:12px">${botao({tipo:'paroquia',id:p.id},'Ver paróquia e todas as igrejas',true)}${botaoGoogle(c)}</div>`;
    const outras = p.comunidades.filter(x => x !== c);
    if (outras.length) h += `<h3>Outras igrejas da paróquia (${outras.length})</h3><ul class="list">${outras.map(x => linhaComunidade(x)).join('')}</ul>`;
  }
  const c = document.getElementById('conteudo');
  c.replaceChildren(el(h));
  c.scrollTop = 0;
  document.getElementById('alca-titulo').textContent = !sel ? 'Arquidiocese de Florianópolis' : sel.tipo==='paroquia' ? paroquia[sel.id].nome : sel.tipo==='igreja' ? igreja[sel.id].nome : forania[sel.id].nome;
  document.getElementById('voltar').hidden = !sel;
  if (celular() && sel) abrirGaveta(true);
}

// ---------- Foco pela rolagem: rolando a lista de igrejas da paróquia, a que passa pela linha de foco fica em destaque ----------
// A linha desce do topo até o fim do painel conforme a rolagem avança, para que a primeira e a última igreja também possam ficar em foco.
let focoAgendado = 0;
function areaLivreCentro(){
  const t = pad(), tl = L.point(t.paddingTopLeft), br = L.point(t.paddingBottomRight), sz = map.getSize();
  return L.point((tl.x + sz.x - br.x) / 2, (tl.y + sz.y - br.y) / 2);
}
function centraNaArea(latlng){
  const desloc = areaLivreCentro().subtract(map.getSize().divideBy(2));
  map.panTo(map.unproject(map.project(latlng).subtract(desloc)), {animate:true, duration:.35});
}
function poeFoco(id){
  if (id === focoId) return;
  if (focoId && marcador[focoId]?.getElement()) { marcador[focoId].getElement().classList.remove('foco'); atualizaTudo(); }
  document.querySelectorAll('#conteudo li.foco').forEach(li => li.classList.remove('foco'));
  focoId = id;
  if (!id) return;
  const li = document.querySelector(`#conteudo [data-foco] li[data-igreja="${CSS.escape(id)}"]`); if (li) li.classList.add('foco');
  const c = igreja[id]; if (!c?.pos) return;
  const e = marcador[id]?.getElement(); if (e) { e.classList.add('foco'); marcador[id].setZIndexOffset(5000); }
  centraNaArea(c.pos);
}
function atualizaFoco(){
  const sc = document.getElementById('conteudo'), ul = sc.querySelector('[data-foco]');
  if (!ul || sel?.tipo !== 'paroquia') return;
  const itens = [...ul.children]; if (!itens.length) return;
  const max = sc.scrollHeight - sc.clientHeight, prog = max > 0 ? Math.min(1, sc.scrollTop / max) : 0;
  const caixa = sc.getBoundingClientRect(), linha = caixa.top + 24 + prog * (caixa.height - 48);
  let melhor = itens[0], dist = Infinity;
  for (const li of itens){ const r = li.getBoundingClientRect(), d = Math.abs((r.top + r.bottom) / 2 - linha); if (d < dist){ dist = d; melhor = li; } }
  poeFoco(melhor.dataset.igreja);
}
document.getElementById('conteudo').addEventListener('scroll', () => {
  cancelAnimationFrame(focoAgendado); focoAgendado = requestAnimationFrame(atualizaFoco);
}, {passive:true});

document.getElementById('conteudo').addEventListener('click', e => {
  const b = e.target.closest('[data-sel]'); if (b) selecionar(JSON.parse(b.dataset.sel));
});

function setModo(m){
  modo = m;
  document.getElementById('modo-paroquia').setAttribute('aria-pressed', m==='paroquia');
  document.getElementById('modo-forania').setAttribute('aria-pressed', m==='forania');
  for (const id in marcador){ camadaIgrejas.removeLayer(marcador[id]); delete marcador[id]; }
  atualizaTudo(); render();
}
document.getElementById('modo-paroquia').onclick = () => setModo('paroquia');
document.getElementById('lista').onclick = () => { map.closePopup(); if (vistaLista) { selecionar(null); return; } if (sel) selecionar(null); vistaLista = true; render(); if (celular()) painel.classList.add('full'); };
document.getElementById('modo-forania').onclick = () => setModo('forania');

// ---------- Busca ----------
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const indice = [
  ...H.foranias.map(f => ({t:f.nome, d:'Forania', s:{tipo:'forania',id:f.id}})),
  ...Object.values(paroquia).map(p => ({t:p.nome, d:p.municipio + ' · ' + forania[p.forania].nome, s:{tipo:'paroquia',id:p.id}})),
  ...D.municipios.features.map(f => ({t:f.properties.nome, d:'Município', s:null, mun:f.properties.nome})),
  ...igrejas.map(c => ({t:c.nome+' ('+c.local+')', d:TIPOS[c.tipo].rot+' · '+c.paroquia.nome, s:{tipo:'igreja',id:c.id}})),
].map(i => ({...i, n:norm(i.t)}));
const inp = document.getElementById('busca'), ul = document.getElementById('sugestoes');
inp.addEventListener('input', () => {
  const q = norm(inp.value.trim());
  if (!q){ ul.hidden = true; return; }
  const r = indice.filter(i => i.n.includes(q)).slice(0,10);
  ul.innerHTML = r.length ? r.map((i,j) => `<li><button data-i="${indice.indexOf(i)}">${esc(i.t)}<br><small>${esc(i.d)}</small></button></li>`).join('') : '<li style="padding:8px 18px;color:var(--muted)">Nada encontrado</li>';
  ul.hidden = false;
});
ul.addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  const it = indice[+b.dataset.i];
  ul.hidden = true; inp.value=''; inp.blur();
  if (it.s) selecionar(it.s);
  else { const f = D.municipios.features.find(f => f.properties.nome === it.mun); map.flyToBounds(L.geoJSON(f).getBounds(), {...pad(), duration:.6}); }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) ul.hidden = true; });

// ---------- Gaveta no celular ----------
const painel = document.getElementById('painel'), alca = document.getElementById('alca');
function medeFolha(){ document.querySelector('.app').style.setProperty('--sheet-h', painel.offsetHeight + 'px'); }
function abrirGaveta(aberta){ painel.classList.toggle('collapsed', !aberta); alca.setAttribute('aria-expanded', aberta); document.getElementById('alca-ico').textContent = aberta ? 'Recolher' : 'Ver detalhes'; requestAnimationFrame(medeFolha); setTimeout(medeFolha, 300); }
new ResizeObserver(medeFolha).observe(painel);
document.getElementById('voltar').onclick = () => { map.closePopup(); selecionar(null); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sel) { map.closePopup(); selecionar(null); } });
alca.onclick = () => abrirGaveta(painel.classList.contains('collapsed'));

render(); atualizaTudo();
if (celular()) abrirGaveta(false);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => location.reload());
})();
</script>
